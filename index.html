<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>5주 과제 안내</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1f2433;--sub:#5d6478;--line:#e3e6ef;--acc:#3b5bdb;--accbg:#edf2ff;
--ok:#2b8a3e;--okbg:#ebfbee;--warn:#c2410c;--warnbg:#fff4e6;--chip:#f1f3f8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161d;--card:#1d2029;--ink:#e8eaf2;--sub:#a3a9bb;
--line:#2d3140;--acc:#8ea6ff;--accbg:#232a45;--ok:#69db7c;--okbg:#1d2c22;--warn:#ffa94d;--warnbg:#33261a;--chip:#262a36}}
:root[data-theme="dark"]{--bg:#14161d;--card:#1d2029;--ink:#e8eaf2;--sub:#a3a9bb;--line:#2d3140;--acc:#8ea6ff;--accbg:#232a45;
--ok:#69db7c;--okbg:#1d2c22;--warn:#ffa94d;--warnbg:#33261a;--chip:#262a36}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 48px}
header{padding:8px 0 4px}
.badge{display:inline-block;font-size:13px;font-weight:700;color:var(--acc);background:var(--accbg);border-radius:999px;padding:3px 11px}
h1{font-size:25px;line-height:1.3;margin:10px 0 4px}
.period{color:var(--sub);font-size:14.5px;margin:0}
.lead{margin:12px 0 0;font-size:15.5px}
.rules{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:16px 0}
.rules h2{font-size:16px;margin:0 0 6px}
.rules ol{margin:0;padding-left:20px}.rules li{margin:3px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips a{flex:0 0 auto;text-decoration:none;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:14px;line-height:1.3;text-align:center}
.chips a b{display:block;font-size:15px}
.chips a.now{background:var(--acc);border-color:var(--acc);color:#fff}
details.week{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:12px 0;overflow:hidden}
details.week[open]{box-shadow:0 2px 10px rgba(0,0,0,.05)}
details.week.now{border-color:var(--acc);border-width:2px}
summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center}
summary::-webkit-details-marker{display:none}
.wn{flex:0 0 auto;width:46px;height:46px;border-radius:12px;background:var(--accbg);color:var(--acc);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1.1}
.wn small{font-size:11px;font-weight:700}
.wt{flex:1;min-width:0}.wt .d{font-size:13px;color:var(--sub)}.wt .g{font-weight:700;font-size:15.5px}
.nowtag{white-space:nowrap;display:inline-block;font-size:12px;font-weight:800;color:#fff;background:var(--acc);border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.prog{flex:0 0 auto;font-size:13px;color:var(--sub)}
.body{padding:0 16px 16px}
.task{border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-top:12px}
.task h3{font-size:16px;margin:0 0 2px;display:flex;gap:8px;align-items:flex-start}
.task h3 .no{flex:0 0 auto;font-size:13px;color:#fff;background:var(--acc);border-radius:7px;padding:1px 7px;margin-top:2px}
.meta{font-size:13px;color:var(--sub);margin:0 0 6px}
.task ol{margin:6px 0 8px;padding-left:20px;font-size:15px}.task li{margin:2px 0}
.pass{font-size:14px;background:var(--okbg);color:var(--ok);border-radius:10px;padding:7px 10px;margin:8px 0}
.lock{font-size:13.5px;background:var(--warnbg);color:var(--warn);border-radius:10px;padding:6px 10px;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.open{display:inline-block;text-decoration:none;background:var(--acc);color:#fff;font-weight:700;border-radius:11px;padding:10px 16px;font-size:15px}
.done{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--sub);cursor:pointer;user-select:none;padding:8px 4px}
.done input{width:20px;height:20px;accent-color:var(--ok)}
.opts{display:grid;gap:8px;margin:8px 0}
.opt{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:9px 11px;text-decoration:none;color:var(--ink)}
.opt span small{display:block;color:var(--sub);font-size:13px}
.opt em{font-style:normal;flex:0 0 auto;font-size:13.5px;font-weight:700;color:var(--acc)}
.help{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:20px;font-size:15px}
.help h2{font-size:16px;margin:0 0 6px}.help ul{margin:0;padding-left:20px}
footer{color:var(--sub);font-size:12.5px;text-align:center;margin-top:18px}

.pick{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.pick b{display:block;font-size:19px;margin-top:6px}
</style></head><body><div class="wrap">
<header><h1>📅 5주 과제 안내</h1><p class="period">10/19(월) ~ 11/20(금) · 내 수업을 고르세요</p></header>

<a class="pick" href="j/"><span class="badge">1학년 · 화요일 오후</span><b>📐 기초 제도</b></a>
<a class="pick" href="m/"><span class="badge">3학년 · 월요일 (1~3교시 반 · 4~6교시 반)</span><b>🤖 AI 사용법 + 내게 필요한 공부</b></a>
<a class="pick" href="f/"><span class="badge">3학년 2반 · 금요일</span><b>🔧 기계수동조립 실습</b></a>
</div></body></html>
